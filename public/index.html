    <title>Malvin Boye — maehlo</title>
    <!-- invert mode (the pond site's dark mode) is applied here, before React
         mounts, so a returning visitor with it on never sees an un-inverted
         flash — ported verbatim from the design handoff's own helmet script. -->
    <script>(function(){var s=document.createElement("style");s.textContent='html[data-inv="1"] img,html[data-inv="1"] image-slot,html[data-inv="1"] video{filter:invert(1)}';document.head.appendChild(s);function a(){try{var i=localStorage.getItem("mh-invert")==="1";var h=document.documentElement;h.style.filter=i?"invert(1)":"";h.style.background=i?"#fff":"";h.setAttribute("data-inv",i?"1":"");}catch(e){}}a();addEventListener("storage",a);addEventListener("mh-invert",a);})();</script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
